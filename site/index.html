<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Status Layanan Internal | Lab 04</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #f3f6fa; color: #182536; }
      main { max-width: 720px; margin: 8vh auto; padding: 2rem; background: white;
             border: 1px solid #dbe4ee; border-radius: 16px; box-shadow: 0 8px 30px #20334d12; }
      .eyebrow { color: #536a82; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: .4rem 0 1rem; font-size: clamp(2rem, 5vw, 3rem); }
      .status { display: inline-block; padding: .45rem .8rem; border-radius: 999px;
                color: #14532d; background: #dcfce7; font-weight: 700; }
      .incident { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #dbe4ee; }
      code { background: #eef3f8; padding: .2rem .4rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Cloud Services · Lab 04</p>
      <h1>Status layanan internal</h1>
      <p class="status">STATUS_OK: Layanan normal</p>
      <p>Halaman ini disajikan Nginx dari folder <code>site/</code> pada komputer lokal.</p>
      <p class="incident">Saat insiden diselesaikan, ubah kalimat status sesuai tiket kerja dan muat ulang halaman.</p>
    </main>
  </body>
</html>
